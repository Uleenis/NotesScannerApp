name: Checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run audit

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run functions:check
      - run: npm run functions:lint
      - run: npm run functions:test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase test db
      - run: npm run db:test:concurrency

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: services/reading
          target: check
          load: true
          tags: notes-reading:check
          cache-from: type=gha,scope=reading
          cache-to: type=gha,mode=max,scope=reading
      - run: docker run --rm notes-reading:check
      - uses: docker/build-push-action@v7
        with:
          context: services/reading
          target: runtime
          tags: notes-reading:local
          cache-from: type=gha,scope=reading
