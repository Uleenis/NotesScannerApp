[project]
name = "reading"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.120",
    "espeakng-loader==0.2.4",
    "httpx2>=2.13",
    "kraken==7.1.1",
    "lingua-language-detector>=2.1",
    "numpy==2.4.6",
    "phonemizer==3.4.0",
    "pillow==12.3.0",
    "scikit-image==0.25.2",
    "scipy==1.15.3",
    "threadpoolctl==3.6.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
constraint-dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "atpublic==7.0.0",
    "attrs==26.1.0",
    "cattrs==26.1.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.2.1",
    "cloudpickle==3.1.2",
    "coremltools==9.0",
    "filelock==3.32.5",
    "flufl-lock==9.1.0",
    "frozenlist==1.8.0",
    "fsspec==2026.7.0",
    "htrmopo==0.6",
    "idna==3.19",
    "imageio==2.37.4",
    "iso639-lang==2.6.3",
    "jinja2==3.1.6",
    "joblib==1.6.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "lazy-loader==0.5",
    "lightning==2.6.1",
    "lightning-utilities==0.15.3",
    "lxml==6.1.3",
    "markdown==3.10.3",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "multidict==6.9.1",
    "networkx==3.6.1",
    "numpy==2.4.6",
    "packaging==26.3",
    "pillow==12.3.0",
    "platformdirs==4.11.7",
    "propcache==0.5.2",
    "protobuf==7.36.1",
    "psutil==7.2.2",
    "pyaml==26.7.0",
    "pyarrow==25.0.1",
    "pygments==2.21.0",
    "python-dateutil==2.9.0.post0",
    "pytorch-lightning==2.6.6",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "regex==2026.9.3",
    "requests==2.34.2",
    "rich==14.0.0",
    "rpds-py==2026.6.3",
    "safetensors==0.7.0",
    "scikit-image==0.25.2",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "setuptools==84.0.0",
    "shapely==2.1.2",
    "sickle==0.7.0",
    "six==1.17.0",
    "sympy==1.14.0",
    "threadpoolctl==3.6.0",
    "tifffile==2026.8.23",
    "torchmetrics==1.9.0",
    "tqdm==4.70.0",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
    "yarl==1.24.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S310", "S314", "S603"]

[tool.mypy]
strict = true
files = ["src", "tests"]
cache_dir = "/tmp/mypy"
untyped_calls_exclude = ["skimage"]

[[tool.mypy.overrides]]
module = [
    "espeakng_loader",
    "kraken",
    "kraken.*",
    "phonemizer",
    "phonemizer.*",
    "scipy",
    "scipy.*",
    "skimage",
    "skimage.*",
    "threadpoolctl",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
